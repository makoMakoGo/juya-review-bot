name: Metrics Refactor

on:
  push:
    branches:
      - agent/metrics-scope

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/metrics-scope
          persist-credentials: true
      - name: Remove superseded Metrics renderer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/admin/templates.js';
          const source = fs.readFileSync(file, 'utf8');
          const startMarker = '\nexport function renderMetricsPage(';
          const endMarker = '\nexport function renderJobsPage(';
          const start = source.indexOf(startMarker);
          if (start < 0) process.exit(0);
          const end = source.indexOf(endMarker, start);
          if (end < 0) throw new Error('renderJobsPage boundary not found');
          fs.writeFileSync(file, source.slice(0, start) + source.slice(end));
          NODE
          npm ci
          node --check src/admin/templates.js
          npm test
          git add src/admin/templates.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name makoMakoGo
          git config user.email makoxfmap@gmail.com
          git commit -m "refactor: remove superseded metrics renderer"
          git push origin HEAD:agent/metrics-scope
