name: Juya Review Bot CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true

      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Apply responsive Metrics refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        shell: bash
        run: |
          git fetch origin agent/daily-trend-chart
          git checkout -B agent/daily-trend-chart origin/agent/daily-trend-chart
          node .github/scripts/pr3-responsive-metrics.js
          node --check src/admin/templates.js
          node --check src/admin/router.js
          node --check test/admin-dashboard-status.test.js
          node --check test/admin-review-fixes.test.js
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'makoMakoGo'
          git config user.email '48956204+makoMakoGo@users.noreply.github.com'
          git add src/admin/templates.js src/admin/router.js test/admin-dashboard-status.test.js test/admin-review-fixes.test.js
          git commit -m 'refactor: complete responsive Metrics architecture'
          git push origin HEAD:agent/daily-trend-chart

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
