name: Juya Review Bot CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true

      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Prepare responsive Metrics branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        shell: bash
        run: |
          git fetch origin agent/daily-trend-chart
          git checkout -B agent/daily-trend-chart origin/agent/daily-trend-chart

      - name: Patch Metrics layout and routing
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node .github/scripts/pr3-patch-layout.js

      - name: Check patched templates
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node --check src/admin/templates.js

      - name: Check patched router
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node --check src/admin/router.js

      - name: Patch legacy Metrics tests
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node .github/scripts/pr3-patch-tests.js

      - name: Check patched dashboard test
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node --check test/admin-dashboard-status.test.js

      - name: Check patched review test
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: node --check test/admin-review-fixes.test.js

      - name: Check responsive Metrics diff
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: git diff --check

      - name: Commit responsive Metrics refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'makoMakoGo'
          git config user.email '48956204+makoMakoGo@users.noreply.github.com'
          git add src/admin/templates.js src/admin/router.js test/admin-dashboard-status.test.js test/admin-review-fixes.test.js
          git commit -m 'refactor: complete responsive Metrics architecture'

      - name: Push responsive Metrics refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/daily-trend-chart'
        run: git push origin HEAD:agent/daily-trend-chart

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        shell: bash
        run: |
          if npm test > /tmp/juya-tests.log 2>&1; then
            tail -n 24 /tmp/juya-tests.log
          else
            awk '
              /^not ok / { printing = 1; remaining = 55 }
              printing { print; remaining -= 1 }
              printing && remaining == 0 { printing = 0 }
            ' /tmp/juya-tests.log
            echo '--- summary ---'
            tail -n 24 /tmp/juya-tests.log
            exit 1
          fi
