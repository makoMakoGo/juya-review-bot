name: PR 3 Failure Log

on:
  pull_request:
    paths:
      - 'src/admin/**'
      - 'test/admin-review-fixes.test.js'
      - '.github/workflows/pr3-failure-log.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install dependencies
        run: npm ci
      - name: Capture failing test
        shell: bash
        run: node --test test/admin-review-fixes.test.js > pr3-failure.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr3-failure-log
          path: pr3-failure.log
          if-no-files-found: error
          retention-days: 1
