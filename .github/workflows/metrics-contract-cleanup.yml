name: Metrics Contract Cleanup

on:
  push:
    branches:
      - agent/metrics-scope

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/metrics-scope
          persist-credentials: true
      - name: Make the Metrics data contract explicit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8');
            const first = source.indexOf(before);
            if (first < 0) return false;
            if (source.indexOf(before, first + before.length) >= 0) throw new Error(`${file}: replacement is ambiguous`);
            fs.writeFileSync(file, source.slice(0, first) + after + source.slice(first + before.length));
            return true;
          }

          replaceOnce(
            'src/admin/metrics-page.js',
            "export function renderMetricsPage({ csrfToken, stats = null, metrics = null, window = '', cspNonce = '' } = {}) {\n  const view = buildMetricsView(stats || metrics || {}, window);",
            "export function renderMetricsPage({ csrfToken, stats = {}, window = '', cspNonce = '' } = {}) {\n  const view = buildMetricsView(stats, window);",
          );

          replaceOnce(
            'src/admin/router.js',
            "      const dashboard = await this.loadDashboard({ request: normalized, session });\n      let window;\n      try {\n        window = normalizeMetricsWindow(normalized.query.get('window'));\n      } catch (error) {\n        return textResponse(error.message, { status: 400 });\n      }\n      return htmlResponse((nonce) => renderMetricsPage({ csrfToken: session.csrfToken, cspNonce: nonce, stats: dashboard.stats, metrics: dashboard.metrics, window }));",
            "      let window;\n      try {\n        window = normalizeMetricsWindow(normalized.query.get('window'));\n      } catch (error) {\n        return textResponse(error.message, { status: 400 });\n      }\n      const dashboard = await this.loadDashboard({ request: normalized, session });\n      return htmlResponse((nonce) => renderMetricsPage({ csrfToken: session.csrfToken, cspNonce: nonce, stats: dashboard.stats, window }));",
          );

          replaceOnce(
            'src/admin/runtime.js',
            "      metrics: stats,\n      stats,",
            "      stats,",
          );
          NODE
          npm ci
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test
          git add src/admin/metrics-page.js src/admin/router.js src/admin/runtime.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name makoMakoGo
          git config user.email makoxfmap@gmail.com
          git commit -m "refactor: make metrics stats contract explicit"
          git push origin HEAD:agent/metrics-scope
