name: Metrics Tests

on:
  pull_request:
    paths:
      - 'src/admin/**'
      - 'test/**'
      - '.github/workflows/metrics-tests.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: files
        shell: bash
        run: |
          files="$(node -e "const fs=require('node:fs'); const files=fs.readdirSync('test').filter(name=>name.endsWith('.test.js')).sort().map(name=>'test/'+name); process.stdout.write(JSON.stringify(files));")"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  file:
    needs: discover
    name: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install dependencies
        run: npm ci
      - name: Run test file
        run: node --test "${{ matrix.file }}"

  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Prepare explicit-scope test update
        shell: bash
        run: |
          mkdir -p /tmp/patched
          node <<'NODE'
          const fs = require('node:fs');
          const sourcePath = 'test/admin-review-fixes.test.js';
          const outputPath = '/tmp/patched/admin-review-fixes.test.js';
          const source = fs.readFileSync(sourcePath, 'utf8');
          const startMarker = "test('metrics repository table keeps numeric columns content-sized and right-aligned'";
          const endMarker = "test('Status last-completed cards compact diagnostic and job ids'";
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('metrics test block not found');
          let block = source.slice(start, end);
          const renderEnd = "      ],\n    },\n  });\n  const markup";
          if (!block.includes(renderEnd)) throw new Error('metrics render call shape changed');
          block = block.replace(renderEnd, "      ],\n    },\n    window: 'all',\n  });\n  const markup");
          block = block.replace(
            'assert.match(markup, /class="gh-table metrics-table"><thead><tr><th data-i18n="th_window"/);',
            'assert.match(markup, /class="gh-table metrics-table"[\\s\\S]*?<thead><tr><th data-i18n="th_window"/);',
          );
          block = block.replace(
            'assert.match(markup, /class="gh-table metrics-table"><thead><tr><th data-i18n="th_day"/);',
            'assert.match(markup, /class="gh-table metrics-table"[\\s\\S]*?<thead><tr><th data-i18n="th_day"/);',
          );
          const patched = source.slice(0, start) + block + source.slice(end);
          if (patched === source) throw new Error('test file was not changed');
          fs.writeFileSync(outputPath, patched);
          NODE
          node --check /tmp/patched/admin-review-fixes.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patched-admin-review-fixes
          path: /tmp/patched/admin-review-fixes.test.js
          if-no-files-found: error
          retention-days: 1
