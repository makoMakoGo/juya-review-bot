name: Metrics Tests

on:
  pull_request:
    paths:
      - 'src/admin/metrics.js'
      - 'src/admin/metrics-page.js'
      - 'src/admin/router.js'
      - 'src/admin/index.js'
      - 'test/admin-metrics.test.js'
      - 'test/admin-dashboard-status.test.js'
      - '.github/workflows/metrics-tests.yml'

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install dependencies
        run: npm ci
      - name: Run focused metrics tests
        run: node --test test/admin-metrics.test.js test/admin-dashboard-status.test.js
      - name: Run full suite with concise failure output
        shell: bash
        run: |
          set -o pipefail
          if npm test > /tmp/juya-tests.log 2>&1; then
            tail -n 40 /tmp/juya-tests.log
          else
            tail -n 240 /tmp/juya-tests.log
            exit 1
          fi
