name: PR 3 Test Matrix

on:
  pull_request:
    paths:
      - 'src/admin/**'
      - 'test/**'
      - '.github/workflows/pr3-test-matrix.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: files
        shell: bash
        run: |
          files="$(node -e "const fs=require('node:fs'); const files=fs.readdirSync('test').filter(name=>name.endsWith('.test.js')).sort().map(name=>'test/'+name); process.stdout.write(JSON.stringify(files));")"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  file:
    needs: discover
    name: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover.outputs.files) }}
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Trust workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Install dependencies
        run: npm ci
      - name: Run test file
        run: node --test "${{ matrix.file }}"
