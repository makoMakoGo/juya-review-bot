name: Juya Review Bot Image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: juya-review-bot-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      LOCAL_IMAGE: juya-review-bot:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/juya-review-bot" >> "$GITHUB_ENV"

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --pull \
            --no-cache \
            --file ./Dockerfile \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$LOCAL_IMAGE" \
            .

      - name: Resolve installed OpenCodeReview version
        shell: bash
        run: |
          set -euo pipefail
          ocr_version_output="$(docker run --rm --entrypoint ocr "$LOCAL_IMAGE" --version)"
          printf '%s\n' "$ocr_version_output"
          ocr_version="$(
            docker run --rm --entrypoint node "$LOCAL_IMAGE" -e \
              "const { execFileSync } = require('node:child_process'); const root = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim(); process.stdout.write(require(root + '/@alibaba-group/open-code-review/package.json').version);"
          )"
          if [[ ! "$ocr_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid installed OpenCodeReview version: $ocr_version" >&2
            exit 1
          fi
          if ! grep -F -- "$ocr_version" <<<"$ocr_version_output" >/dev/null; then
            echo "ocr --version did not report installed package version $ocr_version" >&2
            exit 1
          fi
          echo "OCR_VERSION=$ocr_version" >> "$GITHUB_ENV"

      - name: Check OCR CLI contract
        shell: bash
        run: |
          set -euo pipefail
          help_output="$(docker run --rm --entrypoint ocr "$LOCAL_IMAGE" review --help)"
          printf '%s\n' "$help_output"
          for flag in --from --to --format --concurrency --max-git-procs --timeout; do
            if ! grep -F -- "$flag" <<<"$help_output" >/dev/null; then
              echo "Missing required ocr review flag: $flag" >&2
              exit 1
            fi
          done

      - name: Check OCR JSON contract
        shell: bash
        run: |
          set -euo pipefail
          contract_script="$(cat <<'SH'
          set -eu
          workdir="$(mktemp -d)"
          cd "$workdir"
          git init -q
          git config user.name "Juya Contract Test"
          git config user.email "contract-test@invalid"
          printf 'contract\n' > README.txt
          git add README.txt
          git commit -qm init

          ocr review \
            --from HEAD \
            --to HEAD \
            --format json \
            --concurrency 1 \
            --max-git-procs 1 \
            --timeout 1 \
            > /tmp/ocr-contract.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { validateOcrResult } = await import('/app/src/server.js');
          const raw = fs.readFileSync('/tmp/ocr-contract.json', 'utf8');
          let result;
          try {
            result = JSON.parse(raw);
          } catch (error) {
            console.error(`OCR returned invalid JSON: ${error.message}`);
            process.exit(1);
          }
          if (!validateOcrResult(result)) {
            console.error('OCR output does not satisfy the Juya runtime contract.');
            console.error(JSON.stringify(result, null, 2));
            process.exit(1);
          }
          const commentCount = Array.isArray(result.comments) ? result.comments.length : 0;
          console.log(`validated OCR JSON status=${result.status} comments=${commentCount}`);
          NODE
          SH
          )"
          docker run --rm \
            --entrypoint /bin/sh \
            -e OCR_LLM_URL=http://127.0.0.1:9 \
            -e OCR_LLM_TOKEN=contract-test \
            -e OCR_LLM_MODEL=contract-test \
            -e OCR_USE_ANTHROPIC=false \
            "$LOCAL_IMAGE" \
            -ec "$contract_script"

      - name: Write engine summary
        shell: bash
        run: |
          {
            echo '## OpenCodeReview engine'
            echo
            echo "- Installed version: \`$OCR_VERSION\`"
            echo '- `ocr review` CLI contract: passed'
            echo '- OCR JSON output contract: passed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:latest"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:ocr-$OCR_VERSION"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:ocr-$OCR_VERSION"
