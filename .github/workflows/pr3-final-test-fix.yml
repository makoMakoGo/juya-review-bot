name: PR 3 Final Test Fix

on:
  pull_request:
    paths:
      - 'test/admin-review-fixes.test.js'
      - '.github/workflows/pr3-final-test-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true
      - name: Patch and push the assertion
        shell: bash
        run: |
          git fetch origin agent/daily-trend-chart
          git checkout -B agent/daily-trend-chart origin/agent/daily-trend-chart
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/admin-review-fixes.test.js';
          const source = fs.readFileSync(path, 'utf8');
          const before = `  assert.equal(markup.includes('class="metrics-table'), false);
  assert.equal(markup.includes('overflow-x: auto'), false);
  assert.equal(markup.includes('min-width: 560px'), false);`;
          const after = `  assert.equal(markup.includes('class="metrics-table'), false);
  assert.equal(markup.includes('class="metrics-chart-scroll"'), false);
  assert.equal(markup.includes('class="metrics-daily-layout"'), false);
  assert.equal(markup.includes('class="metrics-daily-table-panel"'), false);`;
          if (!source.includes(after)) {
            if (!source.includes(before)) throw new Error('legacy Metrics assertions not found');
            fs.writeFileSync(path, source.replace(before, after));
          }
          NODE
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'makoMakoGo'
          git config user.email '48956204+makoMakoGo@users.noreply.github.com'
          git add test/admin-review-fixes.test.js
          git commit -m 'test: assert the removed Metrics layout directly'
          git push origin HEAD:agent/daily-trend-chart
