services:
  juya-review-bot:
    image: ghcr.io/makomakogo/juya-review-bot:latest
    pull_policy: always
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:3007:3007"
    volumes:
      - ./github-app-private-key.pem:/config/github-app-private-key.pem:ro
      - ./data:/data
